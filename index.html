<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>PITOT INDUSTRIES EIRL</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #101010;
      --white: #fff;
      --muted: #c4c4c4;
      --red: #e5232e;
      --line: #333;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      width: 100%;
      margin: 0;
      text-align: left;
    }

    .logo-oe {
      display: block;
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      object-fit: contain;
    }

    .encabezado-texto {
      flex: 1;
      min-width: 0;
    }

    .encabezado h1 {
      margin: 0 0 5px;
      font-size: clamp(17px, 4.5vw, 25px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .3px;
      overflow-wrap: anywhere;
    }

    .encabezado h2 {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: .3px;
      color: var(--muted);
    }

    .intro {
      width: 100%;
      margin: 22px 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin-top: 28px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 76px;
      padding: 18px 16px;
      border: 1px solid var(--red);
      border-radius: 12px;
      background: var(--panel);
      color: var(--white);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
      text-decoration: none;
      transition: background .2s, border-color .2s;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      background: #251010;
      border-color: #ff555e;
      outline: none;
    }

    .menu-button:active {
      background: var(--red);
    }

    .brand {
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .logo-pin {
      display: block;
      width: 90px;
      max-width: 80%;
      height: auto;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      color: #ddd;
      margin: 0;
    }

    .brand-name strong {
      color: #fff;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #292929;
      margin-top: 24px;
    }

    .footer {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      margin: 12px 0 0;
    }

    @media (max-width: 380px) {
      .logo-oe {
        width: 56px;
        height: 56px;
        flex-basis: 56px;
      }

      .encabezado {
        gap: 9px;
      }

      .encabezado h1 {
        font-size: 17px;
        letter-spacing: 0;
      }

      .encabezado h2 {
        font-size: 11px;
      }

      .menu-button {
        font-size: 15px;
        min-height: 70px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="encabezado">
      <img
        class="logo-oe"
        src="ic_oe.png"
        alt="Logo de Operatividad Eléctrica"
      >

      <div class="encabezado-texto">
        <h1>PITOT INDUSTRIES</h1>
        <h2>GESTIÓN DE CERTIFICADOS</h2>
      </div>
    </header>

    <p class="intro">
      Selecciona el tipo de certificación que deseas consultar.
    </p>

    <nav class="menu" aria-label="Menú principal">

      <a
        class="menu-button"
        href="index_pat.html"
      >
        CERTIFICACIÓN DE PAT
      </a>

      <a
        class="menu-button"
        href="index_oe.html"
      >
        CERTIFICADOS DE OPERATIVIDAD
      </a>

    </nav>

    <div class="brand">

      <img
        class="logo-pin"
        src="ic_pin.png"
        alt="Logo PITOT INDUSTRIES"
      >

      <p class="brand-name">
        Una app de <strong>PITOT INDUSTRIES EIRL</strong>
      </p>

    </div>

    <div class="divider"></div>

    <p class="footer">
      2026 Grupo Pitot © Todos los derechos reservados. ®
    </p>

  </main>
</body>
</html>
